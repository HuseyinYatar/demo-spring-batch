spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/batchdemo
spring.datasource.username=batchdemo
spring.datasource.password=batchdemo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.batch.job.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:org/springframework/batch/core/schema-postgresql.sql
spring.sql.init.continue-on-error=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

batch.input-csv-path=classpath:data/order-line-items.csv
batch.rejects-file-path=rejected-rows.csv
batch.invoice-summary-output-path=invoice-summary.csv
batch.tax-rate=0.18
batch.chunk-size=5
batch.skip-limit=20
batch.retry-limit=3
batch.simulate-transient-write-failures=true
