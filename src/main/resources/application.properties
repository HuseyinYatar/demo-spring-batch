spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/batchdemo
spring.datasource.username=batchdemo
spring.datasource.password=batchdemo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.batch.job.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:org/springframework/batch/core/schema-postgresql.sql
spring.sql.init.continue-on-error=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Full sampling so every job run is traced end-to-end - a real deployment
# would sample a small fraction instead to control tracing backend volume.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# spring-boot-starter-opentelemetry pulls in micrometer-registry-otlp as a side
# effect of the tracing bridge, which auto-activates a second, push-based
# metrics exporter alongside the existing Prometheus (pull-based) one - and
# Tempo doesn't even serve an OTLP metrics endpoint, so left on this would just
# be periodic connection failures for metrics we already have another way.
management.otlp.metrics.export.enabled=false

batch.input-csv-path=classpath:data/order-line-items.csv
batch.rejects-file-path=rejected-rows.csv
batch.invoice-summary-output-path=invoice-summary.csv
batch.tax-rate=0.18
batch.chunk-size=100
batch.skip-limit=20
batch.retry-limit=3
batch.simulate-transient-write-failures=true
batch.partition-grid-size=6
batch.order-id-page-size=500
