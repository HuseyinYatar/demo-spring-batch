batch.input-csv-path=classpath:data/test-order-line-items.csv
batch.rejects-file-path=${java.io.tmpdir}/batchdemo-test-rejected-rows.csv
batch.invoice-summary-output-path=${java.io.tmpdir}/batchdemo-test-invoice-summary.csv
batch.chunk-size=2
batch.partition-grid-size=1
batch.retry-limit=3
batch.skip-limit=5
batch.simulate-transient-write-failures=false
batch.daily-sales-report-output-dir=${java.io.tmpdir}/batchdemo-test-daily-sales-reports

# Tests capture spans via their own test-only SpanExporter bean (see
# ChunkTracingSpansTest); they don't need a real OTLP export attempt on every
# job run, which would otherwise log a connection-refused stack trace once
# per test since no Tempo container is running during `mvnw test`.
spring.autoconfigure.exclude=org.springframework.boot.micrometer.tracing.opentelemetry.autoconfigure.otlp.OtlpTracingAutoConfiguration
